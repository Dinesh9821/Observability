# Contracted circuit bandwidth (CIR) per Meraki uplink.
#
# WHY THIS FILE EXISTS
# Meraki does not expose contracted circuit bandwidth anywhere in its API.
# A 1 Gbps WAN port terminating a 50 Mbps broadband service is saturated at
# 50 Mbps -- computing utilisation against port speed would report 5% at the
# moment the circuit starts dropping traffic.
#
# Uplinks not listed here still report throughput in bytes/sec; they simply
# produce no utilisation percentage. An absent number you can alert on is
# better than a plausible-looking wrong one.
#
# Later this is generated from the CMDB. For now, hand-maintain it.

circuits:
  - serial: Q2TN-K4NF-U7P9
    uplink: wan1
    circuit_id: Local_Marianna
    provider: Airtel
    site_id: Z-Di-Mauro-Nava
    capacity_bps: 100000000        # 100 Mbps

  - serial: Q2TN-TN3E-AJ3Y
    uplink: wan1
    circuit_id: local_cristin
    provider: Jio
    site_id: Z-Kristin
    capacity_bps: 50000000         # 50 Mbps backup
