# Used when Grafana is installed from the official linux-amd64 tarball
# (no RHEL subscription / no dnf). Paths match grafana.service.

[paths]
data = /var/lib/grafana
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning

[server]
http_addr =
http_port = 3000
domain = localhost

[security]
admin_user = admin
# Set a real password after first login or:
# /opt/grafana/bin/grafana cli admin reset-admin-password '...'

[users]
allow_sign_up = false

[auth.anonymous]
enabled = false
