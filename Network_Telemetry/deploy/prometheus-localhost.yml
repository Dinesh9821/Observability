global:
  scrape_interval: 60s
  scrape_timeout: 30s
  evaluation_interval: 60s
  external_labels:
    environment: production
    platform: wan-telemetry

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: meraki
    static_configs:
      - targets: ['127.0.0.1:9822']
        labels:
          source: meraki
          resolution_s: '60'

  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']

  - job_name: vmanage
    scrape_interval: 60s
    scrape_timeout: 30s
    static_configs:
      - targets: ['127.0.0.1:9823']
        labels:
          source: vmanage
          resolution_s: '60'

  - job_name: inventory
    scrape_interval: 60s
    scrape_timeout: 15s
    static_configs:
      - targets: ['127.0.0.1:9824']
        labels:
          source: inventory
          resolution_s: '60'
